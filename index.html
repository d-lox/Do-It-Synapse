<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07080C">
<title>Synapse</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
:root{
  --sat:0px;--sab:0px;--sal:0px;--sar:0px;
  --r-xs:9px;--r-sm:13px;--r-md:18px;--r-lg:23px;--r-xl:30px;--r-full:999px;
  --pad:16px;--fs:15px;--dur:.26s;--ease:cubic-bezier(.2,.85,.25,1);
  --acc:#3D82F6;--acc2:#FF8A1F;--acc-ink:#fff;
  --acc-soft:rgba(61,130,246,.13);--acc-line:rgba(61,130,246,.30);
  --acc-glow:rgba(61,130,246,.30);--acc-a:rgba(61,130,246,.28);--acc2-a:rgba(255,138,31,.22);
}
body.t-dark{--bg0:#07080c;--bg1:#0b0e15;--surface:#12161f;--surface2:#171c27;
  --line:#1e2431;--line2:#252c3b;--fg:#ecf0f7;--muted:#8b96aa;
  --glass:255,255,255;--gfill:.055;--gline:.11;--blob:.30}
body.t-warm{--bg0:#f6ecd8;--bg1:#fdf5e6;--surface:#fffdf9;--surface2:#fbf3e4;
  --line:#e7dcc3;--line2:#ddceb0;--fg:#2a2418;--muted:#7b6f58;
  --glass:255,255,255;--gfill:.46;--gline:.65;--blob:.20}
body.t-amoled{--bg0:#000000;--bg1:#000000;--surface:#0a0a0c;--surface2:#101013;
  --line:#191920;--line2:#22222b;--fg:#ededf0;--muted:#7c808b;
  --glass:255,255,255;--gfill:.045;--gline:.09;--blob:.22}
body.txt-s{--fs:13.5px}
body.txt-l{--fs:17px}
body.compact{--pad:11px}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  background:var(--bg0);color:var(--fg);font-size:var(--fs);line-height:1.5;
  overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
body[data-motion="0"] *{animation:none!important;transition:none!important}

/* ---------- ambient ---------- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 0%,var(--bg1),var(--bg0) 68%)}
.blob{position:absolute;border-radius:50%;will-change:transform;opacity:var(--blob)}
.b1{width:120vmax;height:120vmax;left:-50vmax;top:-52vmax;
  background:radial-gradient(circle,var(--acc-a),transparent 62%);animation:d1 34s ease-in-out infinite}
.b2{width:96vmax;height:96vmax;right:-42vmax;top:2vmax;
  background:radial-gradient(circle,var(--acc2-a),transparent 64%);animation:d2 44s ease-in-out infinite}
.b3{width:86vmax;height:86vmax;left:2vmax;bottom:-46vmax;
  background:radial-gradient(circle,var(--acc-a),transparent 66%);animation:d3 52s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vmax,6vmax,0) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.04)}50%{transform:translate3d(-10vmax,8vmax,0) scale(.92)}}
@keyframes d3{0%,100%{transform:translate3d(0,0,0) scale(.96)}50%{transform:translate3d(7vmax,-9vmax,0) scale(1.16)}}
body[data-bg="still"] .blob{animation:none!important}
body[data-bg="flat"] .blob{display:none}
body[data-bg="flat"] .ambient{background:var(--bg0)}

/* ---------- glass (fixed look, no knobs) ---------- */
.glass{
  background:rgba(var(--glass),var(--gfill));
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(var(--glass),var(--gline));
}
body.t-amoled .glass{background:rgba(var(--glass),.05)}

/* ---------- topbar ---------- */
.topbar{
  position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;
  padding:calc(var(--sat) + 9px) calc(var(--sar) + 10px) 9px calc(var(--sal) + 10px);
  border:0;border-bottom:1px solid rgba(var(--glass),var(--gline));border-radius:0;
}
.tbinner{display:flex;align-items:center;gap:4px;width:100%;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding-left:2px}
.brand img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 2px 10px var(--acc-glow))}
.brand span{font-size:15px;font-weight:650;letter-spacing:-.2px}

.ibtn{
  width:40px;height:40px;border-radius:var(--r-full);border:0;background:transparent;
  color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  transition:background .18s,transform .14s;
}
.ibtn:active{transform:scale(.9);background:var(--acc-soft)}
.ibtn.sm{width:34px;height:34px}
.ibtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn.sm svg{width:19px;height:19px}

/* ---------- main ---------- */
main{position:relative;z-index:10;flex:1 1 auto;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow:hidden;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{justify-content:center;align-items:center;position:relative;padding:var(--pad)}
.homewrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}
.hero-logo{
  width:104px;height:104px;object-fit:contain;
  filter:drop-shadow(0 16px 44px var(--acc-glow));
  animation:floaty 7s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero-line{margin:16px 0 22px;font-size:14px;color:var(--muted);font-weight:450;letter-spacing:.1px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.pill{
  border:1px solid var(--line);background:rgba(var(--glass),.05);color:var(--fg);
  border-radius:var(--r-full);padding:10px 10px;font-size:12.5px;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;
  transition:border-color .2s,background .2s,transform .14s;min-height:42px;
}
.pill:active{transform:scale(.96);border-color:var(--acc);background:var(--acc-soft)}
.pill svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.privacy{
  position:absolute;bottom:calc(var(--sab) + 14px);font-size:11px;color:var(--muted);
  opacity:.72;letter-spacing:.2px;display:flex;gap:6px;align-items:center;
}
.privacy b{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block}

/* ---------- chat ---------- */
#chat{position:relative}
.chatscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px var(--pad) 14px;-webkit-overflow-scrolling:touch}
.msgs{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.msg{display:flex;flex-direction:column;max-width:100%}
.msg.me{align-items:flex-end}
.msg.ai{align-items:flex-start}
.bubble{
  padding:11px 15px;border-radius:var(--r-lg);font-size:14.6px;line-height:1.62;
  white-space:pre-wrap;word-break:break-word;max-width:88%;
}
.msg.me .bubble{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);
  border-bottom-right-radius:8px;font-weight:500;max-width:86%}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:8px}
.meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:6px;padding:0 4px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.off{background:#9aa4b8}
.meta button{
  background:transparent;border:0;color:var(--muted);font:inherit;font-size:11px;
  cursor:pointer;padding:2px 6px;border-radius:6px;
}
.meta button:active{background:var(--acc-soft);color:var(--acc)}
.thinkline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.thinkbar{height:2px;flex:1;border-radius:2px;background:var(--line);overflow:hidden;position:relative;min-width:40px}
.thinkbar i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:2px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
details.thought{margin-top:6px;font-size:12px;color:var(--muted);max-width:88%}
details.thought summary{cursor:pointer;list-style:none;opacity:.8;outline:none}
details.thought summary::-webkit-details-marker{display:none}
details.thought pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;padding:8px 10px;
  border-left:2px solid var(--acc-line);opacity:.85}
.jump{
  position:absolute;right:calc(var(--pad) + 2px);bottom:10px;width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--fg);display:none;
  place-items:center;cursor:pointer;z-index:5;box-shadow:0 6px 20px -8px rgba(0,0,0,.6);
}
.jump.on{display:grid}

/* ---------- composer ---------- */
.composer{position:relative;z-index:20;flex:0 0 auto;padding:6px var(--pad) calc(var(--sab) + 10px)}
.cwrap{max-width:820px;margin:0 auto}
.chiprow{display:flex;gap:6px;margin-bottom:6px;padding-left:2px}
.mchip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;
  border-radius:var(--r-full);border:1px solid var(--line);background:rgba(var(--glass),.05);
  color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer;max-width:70%;
}
.mchip i{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.mchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inputbar{
  display:flex;align-items:flex-end;gap:2px;padding:4px 4px 4px 4px;
  border-radius:var(--r-xl);transition:border-color .2s;
}
.inputbar:focus-within{border-color:var(--acc-line)}
.inputbar textarea{
  flex:1;resize:none;border:0;background:transparent;color:var(--fg);font:inherit;
  font-size:14.6px;line-height:1.45;padding:9px 2px;max-height:130px;min-height:38px;outline:none;
}
.inputbar textarea::placeholder{color:var(--muted);opacity:.75}
.send{
  width:38px;height:38px;border-radius:50%;border:0;flex:0 0 auto;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);
  display:grid;place-items:center;transition:transform .14s,opacity .2s;
}
.send:active{transform:scale(.9)}
.send[disabled]{opacity:.35}
.send.stop{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.send svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.52);opacity:0;pointer-events:none;
  z-index:60;transition:opacity var(--dur) var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;z-index:70;top:0;left:0;bottom:0;width:282px;max-width:84vw;
  transform:translateX(-102%);transition:transform .3s var(--ease);
  display:flex;flex-direction:column;
  padding:calc(var(--sat) + 16px) 12px calc(var(--sab) + 14px);
  border-radius:0 var(--r-xl) var(--r-xl) 0;border-left:0;border-top:0;border-bottom:0;
  box-shadow:0 0 60px -20px rgba(0,0,0,.7);
}
#drawer.on{transform:translateX(0)}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.dhead img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 10px var(--acc-glow))}
.dhead b{display:block;font-size:15px;letter-spacing:-.2px}
.dhead small{display:block;font-size:10.5px;color:var(--muted);opacity:.8;letter-spacing:.2px}
.dnew{
  display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:var(--r-md);
  border:1px solid var(--acc-line);background:var(--acc-soft);color:var(--fg);
  font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;margin-bottom:10px;width:100%;
}
.dnew svg{width:17px;height:17px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round}
.dlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.ditem{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);
  border:0;background:transparent;color:var(--fg);font:inherit;font-size:13.5px;
  cursor:pointer;text-align:left;width:100%;opacity:.94;
}
.ditem:active{background:var(--acc-soft)}
.ditem svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ditem span{flex:1}
.ditem em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:var(--r-full);
  background:var(--acc-soft);color:var(--acc);font-weight:600}
.dsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
  padding:14px 12px 6px;font-weight:600;opacity:.75}
.dfoot{padding:10px 12px 0;font-size:10.5px;color:var(--muted);opacity:.7;
  border-top:1px solid var(--line);margin-top:8px}

/* ---------- settings ---------- */
#settings{
  position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(620px,100%);
  transform:translateX(102%);transition:transform .3s var(--ease);
  display:flex;flex-direction:column;border-radius:var(--r-xl) 0 0 var(--r-xl);
  border-right:0;border-top:0;border-bottom:0;will-change:transform;
}
#settings.on{transform:translateX(0)}
.shead{display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 12px) 8px 10px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.shead h2{margin:0;font-size:17px;font-weight:680;letter-spacing:-.3px;flex:1}
.ssearch{padding:10px 14px 2px;flex:0 0 auto}
.ssearch input{
  width:100%;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(var(--glass),.05);color:var(--fg);font:inherit;font-size:13.5px;
  padding:0 13px;outline:none;
}
.ssearch input:focus{border-color:var(--acc-line)}
.sbody{flex:1;overflow-y:auto;padding:8px 14px calc(var(--sab) + 34px)}
.sec{margin:8px 0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);
  background:rgba(var(--glass),.025)}
.sect{
  width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;
  background:transparent;border:0;color:var(--fg);font:inherit;font-size:13.8px;
  font-weight:600;cursor:pointer;text-align:left;
}
.sect svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;
  margin-left:auto;transition:transform .25s}
.sec.open .sect svg{transform:rotate(180deg)}
.sect i{width:3px;height:16px;border-radius:2px;background:var(--acc);flex:0 0 auto;
  box-shadow:0 0 12px var(--acc-glow)}
.secbody{display:none;padding:0 14px 12px}
.sec.open .secbody{display:block}
.row{padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lbl{font-size:13.4px;font-weight:520}
.row .hint{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.row .ctl{margin-top:9px}
.row.flat{display:flex;align-items:center;gap:12px}
.row.flat .txt{flex:1;min-width:0}
.row.flat .ctl{margin-top:0;flex:0 0 auto}

.seg{display:flex;gap:4px;padding:3px;border-radius:var(--r-sm);
  background:rgba(var(--glass),.05);border:1px solid var(--line)}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:11.8px;font-weight:550;cursor:pointer;white-space:nowrap;
}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:var(--acc-ink);box-shadow:0 4px 14px -6px var(--acc-glow)}
.selbtn{
  width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:rgba(var(--glass),.04);color:var(--fg);
  font:inherit;font-size:13px;cursor:pointer;text-align:left;
}
.selbtn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbtn svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
.sw{width:46px;height:27px;border-radius:var(--r-full);border:0;
  background:rgba(var(--glass),.14);position:relative;cursor:pointer;transition:background .24s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:transform .26s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sw.on i{transform:translateX(19px)}
.input{
  width:100%;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(var(--glass),.04);color:var(--fg);font:inherit;font-size:13.2px;
  padding:0 12px;outline:none;
}
.input:focus{border-color:var(--acc-line)}
textarea.input{height:auto;min-height:74px;padding:10px 12px;line-height:1.5;resize:vertical}
.btn{
  padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(var(--glass),.05);color:var(--fg);font:inherit;font-size:13px;
  font-weight:550;cursor:pointer;transition:transform .14s;
}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);border:0}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.35)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:22px 9px;margin-top:12px}
.swatch{height:44px;border-radius:var(--r-sm);border:2px solid transparent;cursor:pointer;
  position:relative;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .14s}
.swatch:active{transform:scale(.94)}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 3px var(--acc-soft)}
.swatch small{position:absolute;left:0;right:0;bottom:-15px;font-size:9px;color:var(--muted);
  text-align:center;letter-spacing:.2px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- sheets ---------- */
#sheetRoot{position:fixed;inset:0;z-index:120;pointer-events:none}
.sheetwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.sheetwrap.on .sheetbg{opacity:1}
.sheet{
  position:relative;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 0 calc(var(--sab) + 10px);
  background:var(--bg1);border:1px solid var(--line);border-bottom:0;
  transform:translateY(102%);transition:transform .28s var(--ease);
}
.sheetwrap.on .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 10px;flex:0 0 auto}
.sheet h3{margin:0 18px 10px;font-size:15px;font-weight:640;letter-spacing:-.2px}
.sheetlist{overflow-y:auto;padding:0 8px 6px}
.sopt{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:var(--r-sm);
  border:0;background:transparent;color:var(--fg);font:inherit;font-size:13.6px;
  cursor:pointer;text-align:left;
}
.sopt:active{background:var(--acc-soft)}
.sopt.on{color:var(--acc)}
.sopt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sopt svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2.4;flex:0 0 auto;opacity:0}
.sopt.on svg{opacity:1}
.sheet .pad{padding:0 18px 8px}
.sheet .pad .btn{margin-top:8px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,14px);
  z-index:200;max-width:88vw;padding:10px 16px;border-radius:var(--r-full);
  background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;text-align:center;
  box-shadow:0 12px 34px -12px rgba(0,0,0,.7);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- intro ---------- */
#intro{
  position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;
  padding:calc(var(--sat) + 24px) 26px calc(var(--sab) + 24px);
  background:var(--bg0);transition:opacity .4s;
}
#intro.hide{opacity:0;pointer-events:none}
#intro img{width:128px;height:128px;object-fit:contain;filter:drop-shadow(0 20px 50px var(--acc-glow))}
#intro h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.6px}
#intro p{margin:0;font-size:13px;color:var(--muted);text-align:center;max-width:300px;line-height:1.6}
#intro input{
  width:100%;max-width:300px;height:46px;border-radius:var(--r-md);border:1px solid var(--line);
  background:rgba(var(--glass),.05);color:var(--fg);font:inherit;font-size:14px;
  padding:0 15px;outline:none;text-align:center;
}
#intro input:focus{border-color:var(--acc-line)}

/* ---------- tools ---------- */
.toolwrap{flex:1;overflow-y:auto;padding:var(--pad) var(--pad) calc(var(--sab) + 24px)}
.toolinner{max-width:820px;margin:0 auto}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;padding:8px 14px;border-radius:var(--r-full);border:1px solid var(--line);
  background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;
}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);border-color:transparent}
.card{border-radius:var(--r-md);padding:14px;margin-bottom:12px;
  background:rgba(var(--glass),.035);border:1px solid var(--line)}
.card h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.2px}
.field input,.field select{
  height:38px;border-radius:var(--r-xs);border:1px solid var(--line);
  background:rgba(var(--glass),.04);color:var(--fg);font:inherit;font-size:13px;
  padding:0 10px;outline:none;width:100%;
}
.field input:focus{border-color:var(--acc-line)}
.out{
  margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--acc-soft);

}
.out small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px;letter-spacing:.2px}
.pad2{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{
  height:48px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(var(--glass),.045);color:var(--fg);font:inherit;font-size:16px;
  cursor:pointer;transition:transform .1s,background .15s;
}
.key:active{transform:scale(.95);background:var(--acc-soft)}
.key.op{color:var(--acc);font-weight:600}
.key.eq{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink);border:0;font-weight:700}
.calcdisp{
  min-height:76px;border-radius:var(--r-md);border:1px solid var(--line);
  background:rgba(var(--glass),.03);padding:12px 14px;display:flex;flex-direction:column;

}
.calcdisp .expr{font-size:12.5px;color:var(--muted);min-height:16px;word-break:break-all;text-align:right}
.calcdisp .res{font-size:26px;font-weight:650;letter-spacing:-.5px;word-break:break-all;text-align:right}
.logtable{width:100%;border-collapse:collapse;font-size:12px}
.logtable th{text-align:right;padding:8px 6px;color:var(--muted);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.logtable td{text-align:right;padding:6px;border-bottom:1px solid var(--line);

.logtable td:first-child{color:var(--acc);font-weight:600;text-align:left}
.solverrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.biocard{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:9px;
  overflow:hidden;background:rgba(var(--glass),.03)}
.biocard>button{width:100%;display:flex;align-items:center;gap:9px;padding:12px 14px;
  background:transparent;border:0;color:var(--fg);font:inherit;font-size:13.2px;
  font-weight:550;cursor:pointer;text-align:left}
.biocard>button svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;
  margin-left:auto;transition:transform .22s}
.biocard.open>button svg{transform:rotate(180deg)}
.biobody{display:none;padding:0 14px 14px}
.biocard.open .biobody{display:block}

/* notes & cards */
.noteitem{
  width:100%;text-align:left;border:1px solid var(--line);background:rgba(var(--glass),.035);

.noteitem time{display:block;font-size:10.5px;color:var(--muted);opacity:.7;margin-top:6px}
.toolhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toolhead h3{margin:0;font-size:17px;font-weight:680;letter-spacing:-.3px;flex:1}
.empty{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:12.5px;line-height:1.6;
}
.bigcard{
  border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(var(--glass),.04);
  padding:28px 20px;min-height:210px;display:flex;flex-direction:column;

}
.bigcard .q{font-size:17px;font-weight:600;line-height:1.5}
.bigcard .a{font-size:14.5px;color:var(--muted);line-height:1.6;opacity:0;transition:opacity .3s}
.bigcard.rev .a{opacity:1;color:var(--fg)}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.grade button{padding:13px 6px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:rgba(var(--glass),.05);color:var(--fg);font:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer}
.grade button:active{transform:scale(.96)}
.grade .g0{color:#ff8a8a;border-color:rgba(255,138,138,.3)}
.grade .g2{color:var(--acc);border-color:var(--acc-line)}
.progress{height:2px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .3s}

@media(min-width:760px){
  body{--pad:24px}
  .quick{grid-template-columns:repeat(4,1fr);max-width:640px}
  .homewrap{max-width:640px}
  .hero-logo{width:120px;height:120px}

  #settings{
    top:50%;bottom:auto;right:auto;left:50%;width:min(640px,92vw);max-height:86vh;
    border-radius:var(--r-xl);border:1px solid var(--line);
    transform:translate(-50%,-46%);opacity:0;pointer-events:none;

  }

  .sheetwrap{align-items:center}

    transform:translateY(14px) scale(.98);opacity:0;max-height:76vh;

  .sheetwrap.on .sheet{transform:translateY(0) scale(1);opacity:1}
}
@media(min-width:1000px){
  body{padding-left:250px}

  .topbar{padding-left:calc(var(--sal) + 20px)}
}

<script>
/* ================= storage ================= */
const K='synapse_';
function get(k,d){try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function put(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){toast('Storage is full')}}

/* ================= state ================= */
let UI=Object.assign({
  theme:'dark',accent:'synapse',bg:'ambient',motion:true,reduceColour:false,
  text:'normal',density:'comfortable'
},get('ui',{}));

let CFG=Object.assign({
  provider:'gemini',keys:{},models:{},customBase:'',
  temp:0.7,sys:'',routing:'auto',fallback:true,debug:false
},get('cfg',{}));

let NOTES=get('notes',[]);
let CARDS=get('cards',[]);
let THREAD=get('thread',null);
let CHAT=get('chat',[]);

const ACC={
  synapse:{n:'Synapse',c:'#3D82F6',c2:'#FF8A1F'},
  aurora:{n:'Aurora',c:'#46B4FF',c2:'#8BD450'},
  sunset:{n:'Sunset',c:'#F04438',c2:'#FFC53D'},
  ocean:{n:'Ocean',c:'#2596D6',c2:'#3D82F6'},
  violet:{n:'Violet',c:'#8B5CF6',c2:'#E879F9'},
  ember:{n:'Ember',c:'#F04438',c2:'#FF8A1F'},
  forest:{n:'Forest',c:'#1FA06B',c2:'#8BD450'},
  gold:{n:'Gold',c:'#DFA117',c2:'#FFD24A'},
  rose:{n:'Rose',c:'#E8457C',c2:'#FF9FBC'},
  slate:{n:'Slate',c:'#64748B',c2:'#9AA6BA'}
};

const PROV={
  gemini:{n:'Gemini',base:'',page:'aistudio.google.com',def:'gemini-flash-latest'},
  groq:{n:'Groq',base:'https://api.groq.com/openai/v1',page:'console.groq.com',def:'llama-3.3-70b-versatile'},
  mistral:{n:'Mistral',base:'https://api.mistral.ai/v1',page:'console.mistral.ai',def:'mistral-small-latest'},
  cerebras:{n:'Cerebras',base:'https://api.cerebras.ai/v1',page:'cloud.cerebras.ai',def:'llama-3.3-70b'},
  openrouter:{n:'OpenRouter',base:'https://openrouter.ai/api/v1',page:'openrouter.ai/keys',def:'meta-llama/llama-3.3-70b-instruct:free'},
  deepseek:{n:'DeepSeek',base:'https://api.deepseek.com/v1',page:'platform.deepseek.com',def:'deepseek-chat'},
  custom:{n:'Custom',base:'',page:'',def:''}
};

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const modelOf=p=>CFG.models[p]||PROV[p].def||'';
const keyOf=p=>CFG.keys[p]||'';

/* ================= colour ================= */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgba(h,a){const c=hex2rgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ink(h){return lum(h)>.58?'#0A0C10':'#FFFFFF'}

/* ================= apply UI ================= */
function applyUI(){
  const b=document.body;
  b.className='t-'+UI.theme;
  b.classList.toggle('txt-s',UI.text==='small');
  b.classList.toggle('txt-l',UI.text==='large');
  b.classList.toggle('compact',UI.density==='compact');
  b.dataset.motion=(UI.motion&&!UI.reduceColour)?'1':'0';
  b.dataset.bg=UI.reduceColour?'flat':UI.bg;

  const a=ACC[UI.accent]||ACC.synapse;
  const r=document.documentElement.style;
  r.setProperty('--acc',a.c);
  r.setProperty('--acc2',a.c2);
  r.setProperty('--acc-ink',ink(a.c));
  r.setProperty('--acc-soft',rgba(a.c,.14));
  r.setProperty('--acc-line',rgba(a.c,.32));
  r.setProperty('--acc-glow',rgba(a.c,.32));
  r.setProperty('--acc-a',rgba(a.c,.30));
  r.setProperty('--acc2-a',rgba(a.c2,.22));

  const meta=document.querySelector('meta[name=theme-color]');
  if(meta)meta.setAttribute('content',UI.theme==='warm'?'#F6ECD8':'#07080C');

  nativeBars();
  put('ui',UI);
}

function plugin(){
  try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SynapseBars}catch(e){return null}
}
function nativeBars(){
  const P=plugin(); if(!P||!P.setBars)return;
  try{P.setBars({darkIcons:UI.theme==='warm'}).catch(()=>{})}catch(e){}
}
function setInsets(o){
  if(!o)return;
  const r=document.documentElement.style;
  if(typeof o.top==='number'&&o.top>=0)r.setProperty('--sat',o.top+'px');
  if(typeof o.bottom==='number'&&o.bottom>=0)r.setProperty('--sab',o.bottom+'px');
  if(typeof o.left==='number'&&o.left>=0)r.setProperty('--sal',o.left+'px');
  if(typeof o.right==='number'&&o.right>=0)r.setProperty('--sar',o.right+'px');
}
window.__setInsets=setInsets;

function bootInsets(){
  const P=plugin();
  if(P&&P.getInsets){try{P.getInsets().then(setInsets).catch(()=>{})}catch(e){}}
  setTimeout(()=>{
    const cur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0;
    if(cur<1){
      const d=document.createElement('div');
      d.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      const h=d.getBoundingClientRect().height;d.remove();
      if(h>0)setInsets({top:Math.round(h)});
      else if(window.Capacitor)setInsets({top:28});
    }
  },760);
}

/* ================= toast ================= */
let toastT;
function toast(msg,ms){
  const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2300);
}

/* ================= sheets ================= */
function closeSheet(){
  const w=document.querySelector('.sheetwrap'); if(!w)return;
  w.classList.remove('on');
  const end=()=>{if(w.parentNode)w.parentNode.removeChild(w)};
  if(document.body.dataset.motion==='0')end();else setTimeout(end,270);
}
function openSheet(title,html){
  closeSheet();
  const wrap=document.createElement('div');
  wrap.className='sheetwrap';
  wrap.innerHTML='<div class="sheetbg"></div><div class="sheet">'+
    '<div class="grab"></div>'+(title?'<h3>'+title+'</h3>':'')+html+'</div>';
  $('#sheetRoot').appendChild(wrap);
  wrap.querySelector('.sheetbg').addEventListener('click',closeSheet);
  requestAnimationFrame(()=>wrap.classList.add('on'));
  dragSheet(wrap);
  return wrap;
}
function dragSheet(wrap){
  const sheet=wrap.querySelector('.sheet');
  let y0=null;
  sheet.addEventListener('touchstart',e=>{
    const sc=sheet.querySelector('.sheetlist');
    if(sc&&sc.scrollTop>4&&e.target.closest('.sheetlist'))return;
    y0=e.touches[0].clientY;sheet.style.transition='none';
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(y0===null)return;

function pick(title,options,current,cb){

/* ================= small helpers ================= */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escA(s){return esc(s).replace(/"/g,'&quot;')}
function ago(ts){
  const d=Date.now()-ts;
  if(d<60000)return'just now';
  if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';
  if(d<604800000)return Math.floor(d/86400000)+'d ago';
  return new Date(ts).toLocaleDateString();
}
function fmt(v){
  if(!isFinite(v))return 'undefined';
  if(Math.abs(v)>=1e6||(Math.abs(v)<1e-4&&v!==0))return v.toExponential(4);
  return String(Math.round(v*1e6)/1e6);
}

        '<button class="btn danger" data-act="cardDelete">Delete</button></div>'+

    return;
  }
  const due=dueCount();
  let h='<div class="toolhead"><h3>Flashcards</h3>'+
    '<button class="btn pri sm" data-act="cardNew">New card</button></div>';
  h+='<div class="card"><h4>Progress</h4>'+
     '<div class="lbl" style="font-size:13px">'+due+' due · '+CARDS.length+' total</div>'+
     '<div class="rowbtns" style="margin-top:10px">'+
     '<button class="btn pri sm" data-act="reviewDue">Review due</button>'+
     '<button class="btn sm" data-act="reviewAll">Review all</button>'+
     '<button class="btn sm" data-act="cardFromReply">From last reply</button></div></div>';
  if(!CARDS.length){
    h+='<div class="empty">No flashcards yet.<br>Tap <b>Card</b> on any answer in chat to save it as a flashcard.</div>';
  }else{
    h+=CARDS.slice().sort((a,b)=>(a.due||0)-(b.due||0)).map(c=>{
      const d=!c.due||c.due<=Date.now();
      return '<button class="noteitem" data-card="'+c.id+'"><b>'+esc(c.front)+'</b>'+
        '<p>'+esc((c.back||'').slice(0,120))+'</p>'+
        '<time>'+(d?'Due now':'Due in '+Math.max(1,Math.ceil((c.due-Date.now())/86400000))+'d')+
        (c.deck?' · '+esc(c.deck):'')+'</time></button>';
    }).join('');
  }
  host.innerHTML=h;
  $$('[data-card]').forEach(b=>b.onclick=()=>{cardEdit=+b.dataset.card;renderCards()});
}
function startReview(all){
  const now=Date.now();
  let q=CARDS.filter(c=>all||!c.due||c.due<=now);
  if(!q.length)return toast('Nothing due. Try Review all.');
  q=q.sort(()=>Math.random()-.5).slice(0,25);
  reviewQueue=q;reviewIdx=0;reviewRevealed=false;review=true;renderCards();
}
function grade(g){
  const c=reviewQueue[reviewIdx];
  if(!c)return;
  const DAY=86400000;
  if(g===0){
    c.due=Date.now()+10*60000;
    c.interval=0;
    c.lapses=(c.lapses||0)+1;
  }else{
    const mult=g===2?3.2:2.2;
    let iv=(c.interval||0)*mult;
    if(!c.interval)iv=(g===2?3:1);
    if(g===2)iv=Math.max(iv,3);
    if(g===1)iv=Math.max(iv,1);
    iv=Math.min(iv,180);
    c.interval=iv;
    c.due=Date.now()+iv*DAY;
  }
  c.reps=(c.reps||0)+1;
  put('cards',CARDS);
  reviewIdx++;reviewRevealed=false;
  if(reviewIdx>=reviewQueue.length){
    toast('Session done · '+reviewQueue.length+' cards');
    review=null;renderCards();
  }else renderCards();
}
function cardActions(act){
  if(act==='cardNew'){
    const c={id:Date.now(),front:'',back:'',deck:'',due:Date.now(),interval:0,reps:0};
    CARDS.unshift(c);put('cards',CARDS);cardEdit=c.id;renderCards();return;
  }
  if(act==='cardBack'){cardEdit=null;renderCards();return}
  if(act==='cardSave'){
    const c=CARDS.find(x=>x.id===cardEdit);
    if(c){
      if(!$('#cFront').value.trim()||!$('#cBack').value.trim()){toast('Front and back are required');return}
      c.front=$('#cFront').value.trim();
      c.back=$('#cBack').value.trim();
      c.deck=$('#cDeck').value.trim();
      put('cards',CARDS);toast('Saved');
    }
    cardEdit=null;renderCards();return;
  }
  if(act==='cardDelete'){
    ask('Delete card','This card will be removed.','Delete').then(ok=>{
      if(!ok)return;
      CARDS=CARDS.filter(x=>x.id!==cardEdit);put('cards',CARDS);
      cardEdit=null;renderCards();toast('Deleted');
    });
    return;
  }
  if(act==='reviewDue'){startReview(false);return}
  if(act==='reviewAll'){startReview(true);return}
  if(act==='reveal'){reviewRevealed=true;renderCards();return}
  if(act==='reviewStop'){review=null;renderCards();return}
  if(act==='cardFromReply'){
    const ai=CHAT.slice().reverse().find(m=>m.role==='assistant'&&m.content);
    if(!ai)return toast('No reply yet');
    const q=CHAT.slice(0,CHAT.indexOf(ai)).reverse().find(m=>m.role==='user');
    CARDS.unshift({id:Date.now(),front:(q?q.content:ai.content).slice(0,180),
      back:ai.content.slice(0,1500),deck:'From chat',due:Date.now(),interval:0,reps:0});
    put('cards',CARDS);toast('Flashcard created');renderCards();return;
  }
}

/* ---- math engine ---- */
function fact(n){n=Math.round(n);if(n<0)throw new Error('negative factorial');
  let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function mathScope(){
  const d=calcDeg?Math.PI/180:1;
  return {
    sin:x=>Math.sin(x*d),cos:x=>Math.cos(x*d),tan:x=>Math.tan(x*d),
    asin:x=>Math.asin(x)/d,acos:x=>Math.acos(x)/d,atan:x=>Math.atan(x)/d,
    sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,
    sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,
    log:x=>Math.log10(x),log10:x=>Math.log10(x),ln:x=>Math.log(x),
    PI:Math.PI,E:Math.E
  };
}
function num(expr,extra){
  let s=String(expr).trim();
  if(!s)throw new Error('empty');
  s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-').replace(/\^/g,'**');
  s=s.replace(/π/g,'PI').replace(/\bpi\b/gi,'PI');
  s=s.replace(/(?<![A-Za-z0-9_])e(?![A-Za-z0-9_])/g,'E');
  s=s.replace(/(\d+(?:\.\d+)?)!/g,'fact($1)');
  s=s.replace(/(\d)\s*\(/g,'$1*(');
  s=s.replace(/\)\s*\(/g,')*(');
  if(/[^0-9A-Za-z_+\-*/().,%\s]/.test(s))throw new Error('bad character');
  const scope=mathScope();
  const names=['fact'].concat(Object.keys(scope));
  const vals=[fact].concat(Object.keys(scope).map(k=>scope[k]));
  if(extra)Object.keys(extra).forEach(k=>{names.push(k);vals.push(extra[k])});
  const fn=new Function(names.join(','),'return ('+s+')');
  const v=fn.apply(null,vals);
  if(typeof v!=='number'||isNaN(v))throw new Error('not a number');
  return v;
}
function derive(f,x){const h=1e-5;return (num(f,{x:x+h})-num(f,{x:x-h}))/(2*h)}
function integrate(f,a,b){
  const n=400,h=(b-a)/n;let s=num(f,{x:a})+num(f,{x:b});
  for(let i=1;i<n;i++)s+=(i%2?4:2)*num(f,{x:a+i*h});
  return s*h/3;
}
function showOut(sel,main,sub){
  const o=$(sel); if(!o)return;
  o.style.display='block';
  o.innerHTML=esc(main)+(sub?'<small>'+esc(sub)+'</small>':'');
  o.dataset.copy=main;
}

  });

      if(a==='ans'){calcExpr+=String(calcAns||0);const e=$('#cExpr');if(e)e.textContent=calcExpr;return}

    };

  $$('#toolBody .key').forEach(b=>{

      const e=$('#cExpr'),r=$('#cRes');

      }

  $$('#toolBody [data-run2]').forEach(b=>{

        });

    });

function runTool(k){
  try{
    if(k==='lin'){
      const a=num($('#la').value),b=num($('#lb').value),c=num($('#lc').value);
      if(a===0)throw new Error('a is 0');
      showOut('#oLin','x = '+fmt((c-b)/a),'('+fmt(c)+' − '+fmt(b)+') ÷ '+fmt(a));
    }
    else if(k==='quad'){
      const a=num($('#qa').value),b=num($('#qb').value),c=num($('#qc').value);
      if(a===0)throw new Error('a is 0');
      const d=b*b-4*a*c;
      if(d<0)return showOut('#oQuad','No real roots','discriminant = '+fmt(d));
      const r1=(-b+Math.sqrt(d))/(2*a),r2=(-b-Math.sqrt(d))/(2*a);
      showOut('#oQuad','x₁ = '+fmt(r1)+'   ·   x₂ = '+fmt(r2),'discriminant = '+fmt(d));
    }
    else if(k==='der'){
      const f=$('#fx').value,x=num($('#fx0').value);
      showOut('#oCalc','f′('+fmt(x)+') = '+fmt(derive(f,x)),'central difference · h = 1e-5');
    }
    else if(k==='int'){
      const f=$('#fx').value,a=num($('#fia').value),b=num($('#fib').value);
      showOut('#oCalc','∫ = '+fmt(integrate(f,a,b)),'Simpson · 400 panels · '+fmt(a)+' to '+fmt(b));
    }
    else if(k==='det'||k==='inv'||k==='mul'){
      const A=['a1','a2','a3','a4','a5','a6','a7','a8','a9'].map(i=>num($('#'+i).value));
      const m=[[A[0],A[1],A[2]],[A[3],A[4],A[5]],[A[6],A[7],A[8]]];
      const det=m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
               -m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
               +m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
      if(k==='det')return showOut('#oMat','det = '+fmt(det),'3×3 determinant');
      if(k==='inv'){
        if(Math.abs(det)<1e-12)return showOut('#oMat','Not invertible','determinant is 0');
        const c=[
          [m[1][1]*m[2][2]-m[1][2]*m[2][1],-(m[0][1]*m[2][2]-m[0][2]*m[2][1]),m[0][1]*m[1][2]-m[0][2]*m[1][1]],
          [-(m[1][0]*m[2][2]-m[1][2]*m[2][0]),m[0][0]*m[2][2]-m[0][2]*m[2][0],-(m[0][0]*m[1][2]-m[0][2]*m[1][0])],
          [m[1][0]*m[2][1]-m[1][1]*m[2][0],-(m[0][0]*m[2][1]-m[0][1]*m[2][0]),m[0][0]*m[1][1]-m[0][1]*m[1][0]]
        ];
        const o=$('#oMat');o.style.display='block';
        o.innerHTML=c.map(r=>'[ '+r.map(v=>fmt(v/det)).join('  ')+' ]').join('<br>')+
          '<small>A⁻¹ · det = '+fmt(det)+'</small>';
        return;
      }
      const B=['b1','b2','b3','b4','b5','b6','b7','b8','b9'].map(i=>num($('#'+i).value));
      const n=[[B[0],B[1],B[2]],[B[3],B[4],B[5]],[B[6],B[7],B[8]]];
      const r=[0,1,2].map(i=>[0,1,2].map(j=>m[i][0]*n[0][j]+m[i][1]*n[1][j]+m[i][2]*n[2][j]));
      const o=$('#oMat');o.style.display='block';
      o.innerHTML=r.map(x=>'[ '+x.map(fmt).join('  ')+' ]').join('<br>')+'<small>A × B</small>';
    }
    else if(k==='stat'){
      const v=$('#stData').value.split(/[\s,]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n));
      if(v.length<2)throw new Error('need 2+');
      const nn=v.length,mean=v.reduce((a,b)=>a+b,0)/nn;
      const s=v.slice().sort((a,b)=>a-b);
      const med=nn%2?s[(nn-1)/2]:(s[nn/2-1]+s[nn/2])/2;
      const sd=Math.sqrt(v.reduce((a,x)=>a+(x-mean)*(x-mean),0)/(nn-1));
      showOut('#oStat','mean '+fmt(mean)+' · median '+fmt(med)+' · SD '+fmt(sd),
        'n = '+nn+' · min '+fmt(s[0])+' · max '+fmt(s[nn-1]));
    }
    else if(k==='reg'){
      const x=$('#rx').value.split(/[\s,]+/).filter(Boolean).map(Number);
      const y=$('#ry').value.split(/[\s,]+/).filter(Boolean).map(Number);
      if(x.length!==y.length||x.length<2)throw new Error('mismatch');
      const n=x.length,sx=x.reduce((a,b)=>a+b,0),sy=y.reduce((a,b)=>a+b,0);
      const sxy=x.reduce((s,v,i)=>s+v*y[i],0),sxx=x.reduce((s,v)=>s+v*v,0);
      const m=(n*sxy-sx*sy)/(n*sxx-sx*sx),b=(sy-m*sx)/n;
      let num2=0,d1=0,d2=0;
      const mx=sx/n,my=sy/n;
      for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;num2+=dx*dy;d1+=dx*dx;d2+=dy*dy}
      const r=num2/Math.sqrt(d1*d2);
      showOut('#oReg','y = '+fmt(m)+'x + '+fmt(b),'r² = '+fmt(r*r));
    }
    else if(k==='unit'){
      const v=num($('#uVal').value);
      const f=UNITS[uState.cat][uState.from],t=UNITS[uState.cat][uState.to];
      showOut('#oUnit',fmt(v*f/t)+' '+uState.to,'from '+esc($('#uVal').value)+' '+uState.from);
    }
    else if(k==='log'){
      const bRaw=$('#lgB').value.trim(),xRaw=$('#lgX').value.trim(),yRaw=$('#lgY').value.trim();
      const filled=[bRaw,xRaw,yRaw].filter(v=>v!=='').length;
      if(filled!==2)return showOut('#oLog','Leave exactly one box empty','');
      if(yRaw===''){
        const b=num(bRaw),x=num(xRaw);
        if(b<=0||b===1||x<=0)return showOut('#oLog','base > 0, base ≠ 1, x > 0','');
        showOut('#oLog','y = '+fmt(Math.log(x)/Math.log(b)),'ln('+fmt(x)+') ÷ ln('+fmt(b)+')');
      }else if(xRaw===''){
        const b=num(bRaw),y=num(yRaw);
        if(b<=0||b===1)return showOut('#oLog','base > 0 and ≠ 1','');
        showOut('#oLog','x = '+fmt(Math.pow(b,y)),'b^y = '+fmt(b)+'^'+fmt(y));
      }else{
        const x=num(xRaw),y=num(yRaw);
        if(x<=0||y===0)return showOut('#oLog','x > 0 and y ≠ 0','');
        showOut('#oLog','b = '+fmt(Math.pow(x,1/y)),'x^(1/y)');
      }
    }
  }catch(e){
    const map={lin:'#oLin',quad:'#oQuad',der:'#oCalc',int:'#oCalc',det:'#oMat',inv:'#oMat',
      mul:'#oMat',stat:'#oStat',reg:'#oReg',unit:'#oUnit',log:'#oLog'};
    showOut(map[k],'Check the values','');
  }
}

    b.onclick=()=>{
      const k=b.dataset.bio,o=$('#o_'+k);
      const v=id=>{const el=$('#b_'+id);return el?num(el.value):0};
      try{
        let main='',sub='';
        if(k==='ph'){const h=v('h');if(h<=0)throw 0;main='pH = '+fmt(-Math.log10(h));sub='pH = −log₁₀[H⁺]'}
        else if(k==='hp'){const p=v('p');main='[H⁺] = '+fmt(Math.pow(10,-p))+' mol/L';sub='10^(−pH)'}
        else if(k==='weak'){const ka=v('ka'),c=v('c');
          const x=(-ka+Math.sqrt(ka*ka+4*ka*c))/2;
          main='pH = '+fmt(-Math.log10(x));sub='x = '+fmt(x)+' M · exact solution'}
        else if(k==='molar'){const m=v('m'),mw=v('mw'),vv=v('v');
          main='M = '+fmt(m/mw/vv)+' mol/L';sub='n = '+fmt(m/mw)+' mol'}
        else if(k==='dil'){const c1=v('c1'),v1=v('v1'),c2=v('c2');
          main='V₂ = '+fmt(c1*v1/c2)+' mL';sub='C₁V₁ = C₂V₂'}
        else if(k==='hw'){const q=v('q'),p=1-q;
          main='p² = '+fmt(p*p)+' · 2pq = '+fmt(2*p*q)+' · q² = '+fmt(q*q);
          sub='p = '+fmt(p)+' · q = '+fmt(q)}
        else if(k==='mm'){const vm=v('v'),km=v('km'),s=v('s');
          main='v = '+fmt(vm*s/(km+s));sub='Michaelis–Menten'}
        else if(k==='tt'){
          const m1=v('m1'),s1=v('s1'),n1=v('n1'),m2=v('m2'),s2=v('s2'),n2=v('n2');
          const sp=Math.sqrt(((n1-1)*s1*s1+(n2-1)*s2*s2)/(n1+n2-2));
          const t=(m1-m2)/(sp*Math.sqrt(1/n1+1/n2));
          main='t = '+fmt(t);sub='df = '+(n1+n2-2)+' · pooled SD = '+fmt(sp)}
        else if(k==='chi'){
          const oo=$('#b_o').value.split(/[\s,]+/).filter(Boolean).map(Number);
          const ee=$('#b_e').value.split(/[\s,]+/).filter(Boolean).map(Number);
          if(oo.length!==ee.length)throw 0;
          let x2=0;for(let i=0;i<oo.length;i++)x2+=Math.pow(oo[i]-ee[i],2)/ee[i];
          main='χ² = '+fmt(x2);sub='df = '+(oo.length-1)}
        o.style.display='block';
        o.innerHTML=esc(main)+(sub?'<small>'+esc(sub)+'</small>':'');
        o.dataset.copy=main;
      }catch(e){o.style.display='block';o.innerHTML='Check your inputs';}
    };
  });
}

/* settings events */
$('#sBody').addEventListener('click',e=>{
  const sect=e.target.closest('.sect');
  if(sect){
    const s=sect.parentElement;
    s.classList.toggle('open');
    openSecs[s.dataset.sec]=s.classList.contains('open');
    put('secs',openSecs);
    return;
  }
  const swb=e.target.closest('.sw');
  if(swb){toggleSw(swb);return}
  const sw2=e.target.closest('.swatch');
  if(sw2){UI.accent=sw2.dataset.acc;applyUI();renderSettings();return}
  const sb=e.target.closest('.seg button');
  if(sb){segChange(sb);return}
  const selb=e.target.closest('.selbtn');
  if(selb){selChange(selb.dataset.sel);return}
  const act=e.target.closest('[data-act]');
  if(act){doAct(act.dataset.act);return}
});

function toggleSw(b){
  const id=b.id;
  if(id==='swMotion'){UI.motion=!UI.motion;applyUI();renderSettings();return}
  if(id==='swReduce'){UI.reduceColour=!UI.reduceColour;applyUI();renderSettings();return}
  if(id==='swFallback'){CFG.fallback=!CFG.fallback;put('cfg',CFG);renderSettings();return}
  if(id==='swDebug'){CFG.debug=!CFG.debug;put('cfg',CFG);renderSettings();return}
  if(id==='swQuiz'){put('study_quiz',!get('study_quiz',true));renderSettings();return}
  if(id==='swCite'){put('study_cite',!get('study_cite',true));renderSettings();return}
  b.classList.toggle('on');
}

function segChange(b){
  const wrap=b.closest('.seg');
  const id=wrap.dataset.seg;
  const v=b.dataset.v;
  if(id==='seTheme'){UI.theme=v;applyUI();renderSettings();return}
  if(id==='seBg'){UI.bg=v;applyUI();renderSettings();return}
  if(id==='seText'){UI.text=v;applyUI();renderSettings();return}
  if(id==='seDensity'){UI.density=v;applyUI();renderSettings();return}
  if(id==='seRoute'){CFG.routing=v;put('cfg',CFG);renderSettings();return}
  if(id==='seStyle'){put('study_style',v);renderSettings();return}
  if(id==='seEnter'){put('enter',v);renderSettings();return}
}

function selChange(id){
  if(id==='selProv'){
    pick('Provider',Object.keys(PROV).map(k=>({v:k,l:PROV[k].n})),CFG.provider,v=>{
      CFG.provider=v;put('cfg',CFG);renderSettings();
    });
  }
  if(id==='selLang'){
    const L=[{v:'en-IN',l:'English (India)'},{v:'en-US',l:'English (US)'},{v:'hi-IN',l:'हिन्दी'}];
    pick('Dictation language',L,get('lang','en-IN'),v=>{put('lang',v);renderSettings()});
  }
}

async function doAct(a){
  if(a==='contact'){
    const w=openSheet('Contact developer',
      '<div class="pad"><p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 4px">'+
      'Found a bug or want a feature? Send a screenshot to the developer. Nothing is sent automatically.</p>'+
      '<button class="btn wide pri" id="copyInfo">Copy app details</button></div>');
    w.querySelector('#copyInfo').onclick=()=>copyText(
      'Synapse v0.7.0\nTheme: '+UI.theme+'\nAccent: '+UI.accent+'\nProvider: '+PROV[CFG.provider].n+
      '\nModel: '+modelOf(CFG.provider));
    return;
  }
  if(a==='pasteKey'){
    try{
      const t=await navigator.clipboard.readText();
      if(!t)return toast('Clipboard is empty');
      const el=$('#setKey'); if(el)el.value=t.trim();
      toast('Pasted');
    }catch(e){toast('Long-press the field to paste')}
    return;
  }
  if(a==='saveKey'){
    const el=$('#setKey'); const v=el?el.value.trim():'';
    if(!v)return toast('Nothing to save');
    CFG.keys[CFG.provider]=v;put('cfg',CFG);
    toast('Key saved');updateChip();renderSettings();
    return;
  }
  if(a==='clearKey'){
    if(await ask('Clear key','Remove the saved key for '+PROV[CFG.provider].n+'?','Clear')){
      delete CFG.keys[CFG.provider];put('cfg',CFG);toast('Key cleared');renderSettings();
    }
    return;
  }
  if(a==='pickModel'){
    const list=CFG.models[CFG.provider]||[];
    if(!list.length)return toast('Tap Refresh list first');
    pick('Model',list,modelOf(CFG.provider),v=>{
      CFG.models[CFG.provider]=v;put('cfg',CFG);updateChip();renderSettings();
    });
    return;
  }
  if(a==='refresh'){refreshModels();return}
  if(a==='saveAI'){
    CFG.customBase=($('#setBase')||{}).value||'';
    CFG.sys=($('#setSys')||{}).value||'';
    CFG.temp=parseFloat(($('#setTemp')||{}).value)||0.7;
    const m=($('#setModel')||{}).value;
    if(m&&m.trim())CFG.models[CFG.provider]=m.trim();
    put('cfg',CFG);toast('Saved');updateChip();renderSettings();
    return;
  }
  if(a==='dl'){toast('Offline engine arrives in v0.8');return}
  if(a==='export'){
    const out={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k.indexOf(K)===0)out[k]=localStorage.getItem(k);
    }
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download='synapse-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Backup saved to Downloads');
    return;
  }
  if(a==='import'){
    const f=$('#importFile'); if(f)f.click();
    return;
  }
  if(a==='clearChats'){
    if(await ask('Clear chats','Delete the current chat and all saved conversations?','Delete')){
      CHAT=[];THREAD=null;put('chat',[]);put('thread',null);put('old',[]);
      renderChat();renderDrawer();toast('Chats cleared');showScreen('home');closeSettings();
    }
    return;
  }
  if(a==='resetAll'){
    if(await ask('Reset everything','This wipes chats, notes, flashcards and settings on this phone.','Reset')){
      Object.keys(localStorage).forEach(k=>{if(k.indexOf(K)===0)localStorage.removeItem(k)});
      location.reload();
    }
    return;
  }
  if(a==='doit'){toast('Do It needs its update first');return}
  if(a==='debug'){
    copyText('Synapse v0.7.0\nProvider: '+PROV[CFG.provider].n+'\nModel: '+modelOf(CFG.provider)+
      '\nKey saved: '+(keyOf(CFG.provider)?'yes':'no')+'\nTheme: '+UI.theme+
      '\nAccent: '+UI.accent+'\nLast error: '+(get('debug','')||'none'));
    return;
  }
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Could not copy'));
  }else toast('Copy is not available');
}

$('#sBody').addEventListener('input',e=>{

let cfgT;
function debounceCfg(){clearTimeout(cfgT);cfgT=setTimeout(()=>put('cfg',CFG),320)}

$('#sSearch').oninput=()=>renderSettings();

$('#importFile').onchange=function(){
  const f=this.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    if(!await ask('Import backup','This replaces everything currently saved. Continue?','Import'))return;
    try{
      const o=JSON.parse(r.result);
      Object.keys(o).forEach(k=>localStorage.setItem(k,o[k]));
      toast('Imported. Restarting…');
      setTimeout(()=>location.reload(),900);
    }catch(e){toast('That file could not be read')}
  };
  r.readAsText(f);
};

async function refreshModels(){
  const p=CFG.provider,k=keyOf(p);
  if(!k)return toast('Save an API key first');
  toast('Fetching models…');
  try{
    let list=[];
    if(p==='gemini'){
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(k));
      const j=await r.json();
      if(j.error)throw new Error(j.error.message);
      list=(j.models||[]).map(m=>String(m.name||'').replace('models/','')).filter(Boolean);
    }else{
      const base=p==='custom'?CFG.customBase:PROV[p].base;
      if(!base)throw new Error('No base URL');
      const r=await fetch(base.replace(/\/$/,'')+'/models',{headers:{Authorization:'Bearer '+k}});
      const j=await r.json();
      if(j.error)throw new Error(j.error.message||'bad response');
      list=(j.data||j.models||[]).map(m=>m.id||m.name).filter(Boolean);
    }
    if(!list.length)throw new Error('no models returned');
    CFG.models[p]=list[0];put('cfg',CFG);
    renderSettings();updateChip();
    toast(list.length+' models found');
    pick('Model',list,modelOf(p),v=>{
      CFG.models[p]=v;put('cfg',CFG);updateChip();renderSettings();
    });
  }catch(e){
    put('debug','Model list: '+(e.message||e));
    toast('Could not fetch models');
  }
}

function msgHTML(m,i){
  if(m.role==='user'){
    return '<div class="msg me"><div class="bubble">'+esc(m.content)+'</div></div>';
  }
  const think=m.thinking?'<details class="thought"><summary>Thinking</summary><pre>'+esc(m.thinking)+'</pre></details>':'';
  let meta='';
  if(!m.pending){
    meta='<div class="meta"><span class="dot'+(m.offline?' off':'')+'"></span>'+
      esc(m.provider||'')+(m.model?' · '+esc(m.model):'')+(m.secs?' · '+m.secs+'s':'')+
      (m.switched?' · switched':'')+
      ' <button data-copy="'+i+'">Copy</button>'+
      ' <button data-mkcard="'+i+'">Card</button></div>';
  }
  const body=m.pending
    ? '<span class="stream">'+esc(m.content||'')+'</span>'+
      '<div class="thinkline"><span>Thinking… 0s</span><span class="thinkbar"><i></i></span></div>'
    : esc(m.content||'');
  return '<div class="msg ai"><div class="bubble">'+body+'</div>'+think+meta+'</div>';
}
function renderChat(){
  $('#msgs').innerHTML=CHAT.map(msgHTML).join('');
  bindMsg();
  scrollBottom();
}
function bindMsg(){

        back:m.content.slice(0,1500),deck:'From chat',due:Date.now(),interval:0,reps:0});
      put('cards',CARDS);
      toast('Flashcard saved');
    };
  });
}
function scrollBottom(){
  const s=$('#chatScroll');
  if(s)s.scrollTop=s.scrollHeight;
}
$('#chatScroll').addEventListener('scroll',()=>{
  const s=$('#chatScroll');

/* composer */
const ta=$('#input');
function autoGrow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,130)+'px'}
ta.addEventListener('input',()=>{autoGrow();put('draft',ta.value)});
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&get('enter','off')==='on'){e.preventDefault();send()}
});
ta.addEventListener('focus',()=>setTimeout(scrollBottom,240));

$('#btnSend').onclick=()=>{if(busy)stopChat();else send()};
$('#btnAttach').onclick=()=>toast('Photos and PDFs arrive with the study build');
$('#btnCam').onclick=()=>toast('Camera capture arrives with the study build');
$('#btnMic').onclick=startVoice;
$('#btnChatSearch').onclick=searchChats;

$$('.pill').forEach(p=>{
  p.onclick=()=>{ta.value=p.dataset.q;ta.focus();autoGrow();put('draft',ta.value)};
});

function usePrompt(t){
  ta.value=t;put('draft',t);
  showScreen('chat');ta.focus();autoGrow();
  toast('Ready in the chat box');
}

function setSendState(on){
  const b=$('#btnSend');
  b.classList.toggle('stop',on);
  b.innerHTML=on
    ?'<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>'
    :'<svg viewBox="0 0 24 24"><path d="M4 12l16-7-7 16-2.2-6.8z"/></svg>';
}

function stopChat(){
  if(ctrl){try{ctrl.abort()}catch(e){}}
  clearInterval(window.__timer);clearTimeout(window.__timeout);
  busy=false;setSendState(false);
  $$('#msgs .thinkline').forEach(x=>x.remove());
  const last=CHAT[CHAT.length-1];
  if(last&&last.pending){last.pending=false;last.content=(last.content||'')+'\n\n[stopped]';saveChat();renderChat()}
  saveThread();
}

async function send(){
  const text=ta.value.trim();
  if(!text)return;
  if(!keyOf(CFG.provider)){
    toast('Add your '+PROV[CFG.provider].n+' key in Settings');
    openSettings();return;
  }
  if(CFG.routing==='offline'){
    toast('Offline engine arrives in v0.8. Switch routing to Smart.');return;
  }

  showScreen('chat');
  ta.value='';autoGrow();put('draft','');

  if(!THREAD){
    THREAD={id:Date.now(),title:text.replace(/\s+/g,' ').slice(0,54),ts:Date.now()};
    put('thread',THREAD);
  }

  CHAT.push({role:'user',content:text});
  const ai={role:'assistant',content:'',pending:true,start:Date.now(),
    provider:PROV[CFG.provider].n,model:modelOf(CFG.provider)};
  CHAT.push(ai);
  saveChat();renderChat();

  busy=true;ctrl=new AbortController();setSendState(true);
  const t0=Date.now();
  window.__timer=setInterval(()=>{
    const el=document.querySelector('#msgs .thinkline span');
    if(el)el.textContent='Thinking… '+Math.floor((Date.now()-t0)/1000)+'s';
  },1000);
  window.__timeout=setTimeout(()=>{try{ctrl.abort()}catch(e){}},90000);

  const msgs=CHAT.slice(0,-1).map(m=>({role:m.role,content:m.content}));

  try{
    await stream(CFG.provider,msgs,ai,ctrl);
  }catch(e){
    if(e.name!=='AbortError'){
      const busyErr=/429|503|overload|busy|quota|rate|unavailable/i.test(String(e.message||''));
      if(CFG.provider==='gemini'&&CFG.fallback&&keyOf('deepseek')&&busyErr){
        ai.content='';ai.thinking='';
        ai.provider='DeepSeek';ai.model=modelOf('deepseek');ai.switched=true;
        try{
          await stream('deepseek',msgs,ai,ctrl);
        }catch(e2){
          put('debug',String(e2.message||e2));
          if(!ai.content)ai.content=friendly(e2);
        }
      }else{
        put('debug',String(e.message||e));
        if(!ai.content)ai.content=friendly(e);
      }
    }
  }

  clearInterval(window.__timer);clearTimeout(window.__timeout);
  ai.pending=false;
  ai.secs=((Date.now()-t0)/1000).toFixed(1);
  if(!ai.content)ai.content='No reply. Try again.';
  busy=false;ctrl=null;setSendState(false);
  saveChat();renderChat();saveThread();renderDrawer();
}

function friendly(e){
  const m=String(e&&e.message||e);
  if(/abort/i.test(e&&e.name||''))return 'Stopped.';
  if(/Failed to fetch|NetworkError|network/i.test(m))return 'No internet. Check your connection.';
  if(/429|quota|rate/i.test(m))return 'The provider is busy or your free limit is reached. Try again shortly.';
  if(/401|403|API key|unauthor/i.test(m))return 'That API key was not accepted. Check it in Settings.';
  if(/404|not found/i.test(m))return 'That model does not exist for this key. Try Refresh list in Settings.';
  if(/503|overload|unavailable/i.test(m))return 'The model is overloaded right now. Try again.';
  if(/402|balance|insufficient/i.test(m))return 'That account has no credit left.';
  return 'Something went wrong: '+m.slice(0,150);
}

function sysPrompt(){
  const style=get('study_style','plain');
  let base=CFG.sys||'You are Synapse, a study companion for a biology student. Answer clearly and concisely in plain text. No emojis. Use short paragraphs.';
  if(style==='teen')base+=' Explain as if I am 15 years old.';
  if(style==='exam')base+=' Answer in exam-answer style with mark-scheme wording.';
  return base;
}

async function stream(p,msgs,ai,c){
  if(p==='gemini')return geminiStream(modelOf(p),keyOf(p),msgs,ai,c);
  return openaiStream(p,modelOf(p),keyOf(p),msgs,ai,c);
}

async function geminiStream(model,key,msgs,ai,c){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+
    encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(key);
  const body={
    contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),
    generationConfig:{temperature:CFG.temp},
    systemInstruction:{parts:[{text:sysPrompt()}]}
  };
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),signal:c.signal});
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=(j.error&&j.error.message)||msg}catch(e){}
    throw new Error(msg);
  }
  await readSSE(r,ai,j=>{
    const cand=(j.candidates||[])[0];
    if(!cand)return;
    const parts=(cand.content&&cand.content.parts)||[];
    parts.forEach(pt=>{if(pt.text)ai.content+=pt.text});
    paint(ai);
  });
}

async function openaiStream(p,model,key,msgs,ai,c){
  const base=p==='custom'?CFG.customBase:PROV[p].base;
  if(!base)throw new Error('No base URL for this provider');
  const url=base.replace(/\/$/,'')+'/chat/completions';
  const body={
    model:model,
    messages:[{role:'system',content:sysPrompt()}].concat(msgs),
    temperature:CFG.temp,
    stream:true
  };
  const r=await fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body),signal:c.signal});
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=(j.error&&j.error.message)||msg}catch(e){}
    throw new Error(msg);
  }
  await readSSE(r,ai,j=>{
    const d=(j.choices||[])[0]||{};
    const delta=d.delta||{};
    if(delta.reasoning_content)ai.thinking=(ai.thinking||'')+delta.reasoning_content;
    if(delta.content)ai.content+=delta.content;
    paint(ai);
  });
}

async function readSSE(r,ai,onJson){
  const reader=r.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  while(true){
    const st=await reader.read();
    if(st.done)break;
    buf+=dec.decode(st.value,{stream:true});
    const parts=buf.split('\n');
    buf=parts.pop();
    for(const line of parts){
      const t=line.trim();
      if(!t.startsWith('data:'))continue;
      const d=t.slice(5).trim();
      if(!d||d==='[DONE]')continue;
      try{onJson(JSON.parse(d))}catch(e){}
    }
  }
}

let paintT=null;
function paint(ai){
  if(paintT)return;
  paintT=setTimeout(()=>{
    paintT=null;
    const nodes=$$('#msgs .msg.ai');
    const node=nodes[nodes.length-1];
    if(!node)return;
    const s=node.querySelector('.stream');
    if(s)s.textContent=ai.content;
    if(ai.thinking){
      let t=node.querySelector('.thought');
      if(!t){
        t=document.createElement('details');
        t.className='thought';
        t.innerHTML='<summary>Thinking</summary><pre></pre>';
        node.appendChild(t);
      }
      const pre=t.querySelector('pre');
      if(pre)pre.textContent=ai.thinking;
    }
    const sc=$('#chatScroll');
    if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<200)scrollBottom();
  },50);
}

/* ================= old chats ================= */
function saveThread(){
  if(!THREAD||!CHAT.length)return;
  let old=get('old',[]);
  const clean=CHAT.filter(m=>!m.pending);
  if(!clean.length)return;
  const rec={id:THREAD.id,title:THREAD.title,ts:Date.now(),msgs:clean};
  const i=old.findIndex(c=>c.id===THREAD.id);
  if(i>=0)old[i]=rec;else old.unshift(rec);
  if(old.length>60)old=old.slice(0,60);
  put('old',old);
}
$('#dNew').onclick=()=>{
  saveThread();
  CHAT=[];THREAD=null;put('chat',[]);put('thread',null);
  renderChat();showScreen('home');closeDrawer();ta.value='';put('draft','');
};

function oldChats(){
  const old=get('old',[]);
  if(!old.length)return toast('No saved conversations yet');
  const w=openSheet('Old chats',
    '<div class="sheetlist">'+old.map(c=>
      '<div style="display:flex;align-items:center;gap:4px">'+
      '<button class="sopt" data-open="'+c.id+'" style="flex:1"><span>'+esc(c.title)+'</span>'+
      '<small style="color:var(--muted);font-size:10.5px;margin-left:8px;flex:0 0 auto">'+ago(c.ts)+'</small></button>'+
      '<button class="ibtn sm" data-del="'+c.id+'"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>'+
      '</div>').join('')+'</div>');
  w.querySelectorAll('[data-open]').forEach(b=>{
    b.onclick=()=>{
      const c=get('old',[]).find(x=>String(x.id)===b.dataset.open);
      if(c){
        CHAT=c.msgs||[];
        THREAD={id:c.id,title:c.title,ts:c.ts};
        put('chat',CHAT);put('thread',THREAD);
        renderChat();showScreen('chat');
      }
      closeSheet();
    };
  });
  w.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=async e=>{
      e.stopPropagation();
      if(!await ask('Delete chat','Remove this conversation from this phone?','Delete'))return;
      let old=get('old',[]).filter(x=>String(x.id)!==b.dataset.del);
      put('old',old);renderDrawer();closeSheet();toast('Deleted');
    };
  });
}

function searchChats(){
  const w=openSheet('Search chats',
    '<div class="pad"><input class="input" id="qs" placeholder="Search every conversation…">'+
    '<div id="qres" style="margin-top:10px;max-height:52vh;overflow:auto"></div></div>');
  const q=w.querySelector('#qs');
  const res=w.querySelector('#qres');
  q.focus();
  q.oninput=()=>{
    const v=q.value.trim().toLowerCase();
    if(!v){res.innerHTML='';return}
    const all=get('old',[]);
    const hits=[];
    all.forEach(c=>{
      (c.msgs||[]).forEach(m=>{
        if(m.content&&m.content.toLowerCase().includes(v)){
          hits.push({id:c.id,title:c.title,snip:m.content});
        }
      });
    });
    if(CHAT.length)CHAT.forEach(m=>{
      if(m.content&&m.content.toLowerCase().includes(v))hits.push({id:THREAD&&THREAD.id,title:'Current chat',snip:m.content});
    });
    const seen={},uniq=[];
    hits.forEach(h=>{const k=h.id+'_'+h.snip.slice(0,20);if(!seen[k]){seen[k]=1;uniq.push(h)}});
    res.innerHTML=uniq.length
      ?uniq.slice(0,30).map(h=>
        '<button class="noteitem" data-goto="'+h.id+'"><b>'+esc(h.title)+'</b>'+
        '<p>'+esc(h.snip.slice(0,150))+'</p></button>').join('')
      :'<p style="color:var(--muted);font-size:12.5px;padding:8px">No matches</p>';
    res.querySelectorAll('[data-goto]').forEach(b=>{
      b.onclick=()=>{
        const c=get('old',[]).find(x=>String(x.id)===b.dataset.goto);
        if(c){
          CHAT=c.msgs||[];THREAD={id:c.id,title:c.title,ts:c.ts};
          put('chat',CHAT);put('thread',THREAD);
          renderChat();showScreen('chat');
        }
        closeSheet();
      };
    });
  };
}

/* ================= voice ================= */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Voice input is not available on this device');
  const r=new SR();
  r.lang=get('lang','en-IN');
  r.interimResults=true;
  r.onresult=e=>{
    let t='';
    for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
    ta.value=t;autoGrow();
  };
  r.onerror=()=>toast('Could not hear anything');
  r.onend=()=>{put('draft',ta.value)};
  try{r.start();toast('Listening…')}catch(e){toast('Microphone is busy')}
}

/* ================= intro ================= */
(function intro(){
  if(get('seen',false)){
    $('#intro').classList.add('hide');
    setTimeout(()=>{const i=$('#intro');if(i)i.remove()},500);
    return;
  }
  $('#introGo').onclick=()=>{
    const n=$('#introName').value.trim();
    if(n)put('name',n);
    put('seen',true);
    $('#intro').classList.add('hide');
    setTimeout(()=>{const i=$('#intro');if(i)i.remove()},500);
    toast(n?('Welcome, '+n):'Welcome');
  };
})();
