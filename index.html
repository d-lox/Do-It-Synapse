<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synapse</title>
<style>
:root{
  --bg:#000;
  --text:#fff;
  --muted:#8a8a90;
  --a1:#5aa9e6;
  --a2:#7bc67b;
  --glass:rgba(255,255,255,0.07);
  --edge:rgba(255,255,255,0.14);
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:70vw;height:70vw;background:var(--a1);top:-15vw;left:-20vw;animation:m1 18s ease-in-out infinite alternate}
.b2{width:65vw;height:65vw;background:var(--a2);bottom:-10vw;right:-20vw;animation:m2 22s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(30vw,20vw)}}
@keyframes m2{to{transform:translate(-25vw,-25vw)}}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--edge);
  border-top-color:rgba(255,255,255,0.28);
  border-left-color:rgba(255,255,255,0.22);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}

.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.screen.active{display:flex}

#entry{align-items:center;justify-content:center;padding:24px}
.logo{width:120px;height:120px;object-fit:contain;margin-bottom:28px}
.card{width:100%;max-width:330px;padding:28px;border-radius:28px;text-align:center}
.card h2{margin:0 0 6px;font-weight:500}
.card p{margin:0 0 20px;color:var(--muted)}
input[type=text]{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,0.35);color:#fff;font-size:16px;outline:none}
.card input{margin-bottom:18px}
.primary{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:#000;background:linear-gradient(90deg,var(--a1),var(--a2))}

.header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
.title{font-weight:600;letter-spacing:4px;font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,0.12)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.right{display:flex;gap:4px}

.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty img{width:64px;opacity:.7;margin-bottom:14px}
.empty h3{color:#fff;font-weight:500;margin:0 0 6px;font-size:22px}
.empty p{margin:0}

.bottom{padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.bar{display:flex;align-items:center;gap:2px;border-radius:32px;padding:4px 8px}
.bar input{flex:1;min-width:0;background:transparent;border:none;color:#fff;font-size:16px;padding:12px 6px;outline:none}
.send{background:linear-gradient(90deg,var(--a1),var(--a2));color:#000}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.overlay.show{opacity:1;pointer-events:auto}

.drawer{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:82vw;z-index:21;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:0 28px 28px 0;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 20px;display:flex;flex-direction:column;background:rgba(20,20,26,0.55)}
.drawer.open{transform:none}
.drawer h2{margin:0 0 20px 8px;font-weight:600;letter-spacing:3px;font-size:15px}
.item{padding:14px;border-radius:14px;font-size:16px}
.item:active{background:rgba(255,255,255,0.12)}
.ver{margin-top:auto;text-align:center;color:var(--muted);font-size:12px}

.sheet{position:fixed;left:0;right:0;bottom:0;height:88%;z-index:21;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:28px 28px 0 0;display:flex;flex-direction:column;background:rgba(20,20,26,0.6)}
.sheet.open{transform:none}
.sheet-head{display:flex;justify-content:center;align-items:center;padding:18px;font-weight:600;position:relative;border-bottom:1px solid var(--edge)}
.sheet-head .icon-btn{position:absolute;right:10px;top:8px}
.sheet-body{flex:1;overflow-y:auto;padding:20px}
.sheet-body p{color:var(--muted)}
.ghost{padding:12px 16px;border-radius:14px;border:1px solid var(--edge);background:transparent;color:#fff;font-size:15px}
</style>
</head>
<body>

<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div></div>

<!-- ENTRY -->
<div id="entry" class="screen active">
  <img src="Yes.png" class="logo" alt="Synapse">
  <div class="glass card">
    <h2>Welcome</h2>
    <p>What should I call you?</p>
    <input type="text" id="nameInput" placeholder="Your name">
    <button class="primary" id="startBtn">Start</button>
  </div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
  <div class="header">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span class="title">SYNAPSE</span>
    <div class="right">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>

  <div class="chat">
    <div class="empty">
      <img src="Yes.png" alt="">
      <h3 id="greeting">Hello.</h3>
      <p>How can I help you study today?</p>
    </div>
  </div>

  <div class="bottom">
    <div class="glass bar">
      <button class="icon-btn" aria-label="Add">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" aria-label="Camera">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input type="text" placeholder="Ask Synapse">
      <button class="icon-btn" aria-label="Voice">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
      </button>
      <button class="icon-btn send" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay"></div>

<!-- DRAWER -->
<div id="drawer" class="glass drawer">
  <h2>MENU</h2>
  <div class="item">New chat</div>
  <div class="item">Search</div>
  <div class="item">Old chats</div>
  <div class="item">Flashcards</div>
  <div class="item">Notes</div>
  <div class="item">Calculator</div>
  <div class="item">Bio toolkit</div>
  <div class="ver">v0.1.1</div>
</div>

<!-- SETTINGS -->
<div id="sheet" class="glass sheet">
  <div class="sheet-head">
    Settings
    <button class="icon-btn" id="closeBtn" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <p>Settings sections will go here in the next part.</p>
    <button class="ghost" id="resetBtn">Change name (test)</button>
  </div>
</div>

<script>
(function(){
  var entry=document.getElementById('entry');
  var main=document.getElementById('main');
  var nameInput=document.getElementById('nameInput');
  var greeting=document.getElementById('greeting');
  var overlay=document.getElementById('overlay');
  var drawer=document.getElementById('drawer');
  var sheet=document.getElementById('sheet');

  function show(name){
    greeting.textContent='Hello, '+name+'.';
    entry.classList.remove('active');
    main.classList.add('active');
  }
  function closeAll(){
    overlay.classList.remove('show');
    drawer.classList.remove('open');
    sheet.classList.remove('open');
  }

  var saved=null;
  try{saved=localStorage.getItem('synapse_name');}catch(e){}
  if(saved){show(saved);}

  document.getElementById('startBtn').addEventListener('click',function(){
    var n=nameInput.value.trim()||'Student';
    try{localStorage.setItem('synapse_name',n);}catch(e){}
    show(n);
  });
  document.getElementById('menuBtn').addEventListener('click',function(){
    overlay.classList.add('show');drawer.classList.add('open');
  });
  document.getElementById('settingsBtn').addEventListener('click',function(){
    overlay.classList.add('show');sheet.classList.add('open');
  });
  document.getElementById('closeBtn').addEventListener('click',closeAll);
  overlay.addEventListener('click',closeAll);
  document.getElementById('resetBtn').addEventListener('click',function(){
    try{localStorage.removeItem('synapse_name');}catch(e){}
    closeAll();
    main.classList.remove('active');
    entry.classList.add('active');
  });
})();
</script>
</body>
</html>
