<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synapse</title>
<style>
  :root {
    --bg-color: #000000;
    --text-main: #ffffff;
    --text-muted: #888888;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent-1: #10b981; /* Green */
    --accent-2: #3b82f6; /* Blue */
    --safe-top: env(safe-area-inset-top, 40px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }

  /* Themes */
  body.theme-warm {
    --bg-color: #1a1814;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --text-main: #f5eedc;
  }
  body.theme-amoled {
    --bg-color: #000000;
    --glass-bg: rgba(20, 20, 20, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; height: 100vh; width: 100vw;
    background-color: var(--bg-color); color: var(--text-main);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden; position: relative;
  }

  /* Ambient Background */
  .ambient-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; overflow: hidden; pointer-events: none;
  }
  .ambient-blob {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.4;
    animation: float 10s infinite alternate ease-in-out;
  }
  .blob-1 {
    width: 250px; height: 250px; background: var(--accent-1);
    top: -50px; left: -50px;
  }
  .blob-2 {
    width: 300px; height: 300px; background: var(--accent-2);
    bottom: -100px; right: -50px; animation-delay: -5s;
  }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  /* Glassmorphism */
