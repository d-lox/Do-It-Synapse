name: Build Synapse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm packages
        run: npm install

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Prepare web folder
        run: |
          set -e
          mkdir -p www
          cp index.html www/index.html
          for f in Yes.png No.png; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing from the repo root"
              exit 1
            fi
            cp "$f" "www/$f"
          done
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Launcher icon from Yes.png
        run: |
          set -e
          res=android/app/src/main/res
          mkdir -p $res/mipmap-anydpi-v26 $res/values
          HEX=$(convert Yes.png -crop 1x1+0+0 -format "%[hex:p{0,0}]" info: 2>/dev/null || echo "000000")
          HEX=${HEX:0:6}
          echo "Icon background sampled: #$HEX"
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"ic_launcher_background\">#$HEX</color></resources>" > $res/values/ic_launcher_background.xml

          gen() {
            dpi=$1; leg=$2; ada=$3
            convert Yes.png -resize "${leg}x${leg}^" -gravity center -extent ${leg}x${leg} "$res/mipmap-$dpi/ic_launcher.png"
            convert Yes.png -resize "${leg}x${leg}^" -gravity center -extent ${leg}x${leg} "$res/mipmap-$dpi/ic_launcher_round.png"
            convert Yes.png -resize "${ada}x${ada}^" -gravity center -extent ${ada}x${ada} "$res/mipmap-$dpi/ic_launcher_bg.png"
            convert -size ${ada}x${ada} xc:none "$res/mipmap-$dpi/ic_launcher_foreground.png"
          }
          gen mdpi    48  108
          gen hdpi    72  162
          gen xhdpi   96  216
          gen xxhdpi  144 324
          gen xxxhdpi 192 432

          cat > $res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_bg"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $res/mipmap-anydpi-v26/ic_launcher.xml $res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Dark splash
        run: |
          set -e
          res=android/app/src/main/res
          found=0
          while IFS= read -r f; do
            convert -size 1200x1200 xc:'#07080C' "png:$f"
            found=1
          done < <(find $res -type f -name 'splash.png' 2>/dev/null)
          echo "splash files replaced: $found"

      - name: Full screen native
        run: |
          set -e
          base=android/app/src/main/java/com/dlox/synapse
          mkdir -p $base
          cat > $base/MainActivity.java <<'EOF'
          package com.dlox.synapse;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            public static String lastInsets = "{}";

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SynapseBars.class);
              super.onCreate(savedInstanceState);

              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) {
                w.setStatusBarContrastEnforced(false);
                w.setNavigationBarContrastEnforced(false);
              }
              WindowInsetsControllerCompat c =
                  WindowCompat.getInsetsController(w, w.getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);

              installInsets();
            }

            private void installInsets() {
              final View d = getWindow().getDecorView();
              d.setOnApplyWindowInsetsListener((v, insets) -> {
                WindowInsetsCompat i = WindowInsetsCompat.toWindowInsetsCompat(insets, v);
                androidx.core.graphics.Insets b =
                    i.getInsets(WindowInsetsCompat.Type.systemBars());
                lastInsets = "{\"top\":" + b.top + ",\"bottom\":" + b.bottom +
                             ",\"left\":" + b.left + ",\"right\":" + b.right + "}";
                pushInsets();
                return WindowInsetsCompat.CONSUMED;
              });
              d.requestApplyInsets();
              d.postDelayed(this::pushInsets, 400);
              d.postDelayed(this::pushInsets, 1000);
              d.postDelayed(this::pushInsets, 2200);
            }

            private void pushInsets() {
              Bridge b = getBridge();
              if (b == null || b.getWebView() == null) return;
              final String js = "window.__setInsets && window.__setInsets(" + lastInsets + ")";
              b.getWebView().post(() -> b.getWebView().evaluateJavascript(js, null));
            }

            @Override
            public void onResume() {
              super.onResume();
              installInsets();
            }
          }
          EOF

      - name: Bars plugin
        run: |
          set -e
          base=android/app/src/main/java/com/dlox/synapse
          cat > $base/SynapseBars.java <<'EOF'
          package com.dlox.synapse;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "SynapseBars")
          public class SynapseBars extends Plugin {

            @PluginMethod
            public void setBars(PluginCall call) {
              Boolean dark = call.getBoolean("darkIcons", false);
              final boolean d = dark != null && dark;
              getActivity().runOnUiThread(() -> {
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(
                    getActivity().getWindow(), getActivity().getWindow().getDecorView());
                c.setAppearanceLightStatusBars(d);
                c.setAppearanceLightNavigationBars(d);
              });
              call.resolve();
            }

            @PluginMethod
            public void getInsets(PluginCall call) {
              JSObject o = new JSObject();
              try {
                JSONObject j = new JSONObject(MainActivity.lastInsets);
                o.put("top", j.optInt("top"));
                o.put("bottom", j.optInt("bottom"));
                o.put("left", j.optInt("left"));
                o.put("right", j.optInt("right"));
              } catch (Exception e) {
                o.put("top", 0);
                o.put("bottom", 0);
                o.put("left", 0);
                o.put("right", 0);
              }
              call.resolve(o);
            }
          }
          EOF

      - name: Signing key
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/synapse.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("synapse.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "synapse"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
