name: Build Synapse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install parts
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp Yes.png No.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Make app icon from Yes.png
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            convert Yes.png -crop 720x720+140+140 +repage -resize $2x$2 $RES/mipmap-$1/ic_launcher.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
            INNER=$(( $3 * 66 / 100 ))
            convert Yes.png -crop 720x720+140+140 +repage -resize ${INNER}x${INNER} -background black -gravity center -extent $3x$3 $RES/mipmap-$1/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

      - name: Load permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/synapse.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/synapse.jks" -storepass "$KEYSTORE_PASSWORD"

      - name: Tell Android to use the key
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  synapse {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "synapse"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.synapse
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/synapse.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
